<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Facebook Login</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="facebook.css">
</head>

<body>

    <div class="main-container">

        <!-- LEFT SIDE -->
        <div class="left-section">

            <h1>facebook</h1>

            <p>
                Connect with friends and the world<br>
                around you on Facebook.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-section">

            <div class="login-box">

                <!-- Login Form -->
                <form>

                    <input
                        type="text"
                        placeholder="Email or phone number"
                    >

                    <input
                        type="password"
                        placeholder="Password"
                    >

                    <button
                        type="submit"
                        class="login-btn">
                        Login
                    </button>

                </form>


                <!-- Forgot Password -->
                <a href="#" class="forgot-password">
                    Forgot password?
                </a>


                <!-- Horizontal Line -->
                <div class="line"></div>


                <!-- Create Account -->
                <button class="create-account">
                    Create new account
                </button>

            </div>

        </div>

    </div>

</body>

</html>
