<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="ludo.css">
</head>

<body>

<div class="ludo-board">

    <!-- GREEN HOME -->
    <div class="home green-home">
        <div class="token-box">
            <div class="token green-token"></div>
            <div class="token green-token"></div>
            <div class="token green-token"></div>
            <div class="token green-token"></div>
        </div>
    </div>

    <!-- YELLOW HOME -->
    <div class="home yellow-home">
        <div class="token-box">
            <div class="token yellow-token"></div>
            <div class="token yellow-token"></div>
            <div class="token yellow-token"></div>
            <div class="token yellow-token"></div>
        </div>
    </div>

    <!-- RED HOME -->
    <div class="home red-home">
        <div class="token-box">
            <div class="token red-token"></div>
            <div class="token red-token"></div>
            <div class="token red-token"></div>
            <div class="token red-token"></div>
        </div>
    </div>

    <!-- BLUE HOME -->
    <div class="home blue-home">
        <div class="token-box">
            <div class="token blue-token"></div>
            <div class="token blue-token"></div>
            <div class="token blue-token"></div>
            <div class="token blue-token"></div>
        </div>
    </div>


    <!-- TOP TRACK -->
    <div class="track top-track">

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-cell"></div>

        <div class="cell star">☆</div>
        <div class="cell"></div>
        <div class="cell yellow-cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell yellow-cell"></div>

        <div class="cell arrow yellow-arrow">↓</div>
        <div class="cell"></div>
        <div class="cell yellow-cell"></div>

    </div>


    <!-- BOTTOM TRACK -->
    <div class="track bottom-track">

        <div class="cell red-cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell red-cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell red-cell"></div>
        <div class="cell"></div>
        <div class="cell star">☆</div>

        <div class="cell red-cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell red-cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell red-cell"></div>
        <div class="cell"></div>
        <div class="cell arrow red-arrow">↑</div>

    </div>


    <!-- LEFT TRACK -->
    <div class="track left-track">

        <div class="cell arrow green-arrow">→</div>
        <div class="cell green-cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell green-cell"></div>
        <div class="cell green-cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell star">☆</div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

    </div>


    <!-- RIGHT TRACK -->
    <div class="track right-track">

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell star">☆</div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell blue-cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell blue-cell"></div>
        <div class="cell arrow blue-arrow">←</div>

    </div>


    <!-- CENTER -->
    <div class="center">

        <div class="triangle triangle-yellow"></div>
        <div class="triangle triangle-blue"></div>
        <div class="triangle triangle-red"></div>
        <div class="triangle triangle-green"></div>

    </div>

</div>

</body>
</html>
