<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dynamic blog page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>Dynamic blog</h1>
        <p>read interesting posts from our blog</p>
    </header>
    <main class="container">
        <section class="controls">

            <input type="search" id="searchinput" placeholder=" search posts by title...">
            <button id="realoadButton" type="button"> 
        reaload posts
    </button>
        </section>
        <p id="statusMessage" role="status" aria-live="polite">
            loading posts...
        </p>
        <section id="postscontainer" class="posts-grid">
        </section>
    </main>
    <script src="app.js">
    </script>
</body>

</html>
